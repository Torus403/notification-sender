name: js

# Paused: runs only when started by hand from the Actions tab. To re-enable, restore the
# push and pull_request triggers from git history.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # On pull requests, only packages changed since the base branch (and their dependents) run.
      - run: pnpm turbo run typecheck test build ${{ github.event_name == 'pull_request' && '--affected' || '' }}
